<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TapSync</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="mainMenu" class="screen active">
    <h1 class="logo">TapSync</h1>
    <button id="playBtn">Play</button>
    <button id="libraryBtn">Song Library</button>
</div>

<div id="libraryScreen" class="screen">
    <h2>Your Songs</h2>
    <div id="songList"></div>
    <button id="uploadBtn">Upload Song</button>
    <input type="file" id="musicInput" accept="audio/mp3,audio/*" hidden />
    <button onclick="goToMenu()">Back</button>
</div>

<div id="gameScreen" class="screen">
    <div id="hud">
        <div id="score">0</div>
        <div id="combo">0</div>
        <div id="accuracy">100%</div>
    </div>
    <div id="gameArea"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
