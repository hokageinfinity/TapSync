<body>

<div id="mainMenu" class="screen active">
    <h1>TapSync</h1>
    <button id="playBtn">Play</button>
    <button id="libraryBtn">Song Library</button>
</div>

<div id="libraryScreen" class="screen">
    <h2>Your Songs</h2>

    <div id="songList"></div>

    <button id="uploadBtn">Import Song</button>
    <input type="file" id="musicInput" accept="audio/*" hidden />

    <button id="backToMenuBtn">Back</button>
</div>

<div id="gameScreen" class="screen">
    <div id="gameArea"></div>
</div>

<script type="module" src="./js/app.js"></script>

</body>
